[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mbqc"
version = "0.1.0"
description = "A short course on measurement-based quantum computation, taught through readable NumPy code"
authors = [{ name = "Liuke Lyu" }]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "scipy", "pennylane>=0.45", "jupyter"]
test = ["pytest", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools]
packages = ["mbqc"]

[tool.pytest.ini_options]
markers = ["slow: executes the notebooks"]
addopts = "-m 'not slow'"
